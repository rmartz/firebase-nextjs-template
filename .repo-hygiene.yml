# Repository hygiene gates, enforced by @rmartz/repo-hygiene. In CI they run via
# the reusable workflow (.github/workflows/repo-hygiene.yml); locally the
# `hygiene` / `hygiene:staged` package scripts and the pre-commit hooks run the
# same set. The enabled checks are named explicitly (in both the workflow and
# the scripts) — the package's default runs only conflict-markers + action-pins,
# so the opt-in checks below must be listed to run:
#
#   - conflict-markers  merge-conflict markers in tracked/staged content
#   - action-pins       every GitHub Action pinned to a SHA + full-semver comment
#   - package-pins      every package.json dependency pinned to a full
#                       [major].[minor].[patch] base (replaces the old local
#                       scripts/validate-pins.mjs + "Pin format" CI job)
#   - md-pairing        AGENTS.md / CLAUDE.md travel together, as real files
#   - okf               OKF frontmatter conformance for docs/ content pages (see below)
#   - okf-index         docs/ index-tree navigability (every dir has an index.md,
#                       every content page and sub-index is linked from it)
#   - file-caps         per-glob line/byte size caps (see below)
#
# Only checks that need settings appear below; the rest use their defaults
# (okf-index defaults — roots [docs], indexName index.md — already match).
#
# This template consolidated its previously-bespoke check scripts onto the
# shared package. Where a centralized check does not yet cover a rule the old
# local script enforced, an ai-tools issue tracks the gap — when it lands, bump
# the dependency to inherit the coverage (no template change needed):
#   - okf optional field families (status/timestamps/actors/…): rmartz/ai-tools#202
#   - md-pairing bare `@AGENTS.md` wrapper content: rmartz/ai-tools#203
#
# Zero-soft-tier stance (mirrors `eslint --max-warnings 0`): every tier is an
# error tier — no warn-only thresholds that would pass silently.
checks:
  okf:
    types: [Script, Subsystem]
    roots: [docs]
    # Index pages are the OKF directory index and carry no content frontmatter,
    # so they are exempt from okf's content-page scope (their presence and
    # linkage is enforced by okf-index instead). `exempt` is an exact-path list,
    # not globs, so a new docs subdirectory's index.md must be added here.
    exempt:
      - docs/index.md
      - docs/scripts/index.md
      - docs/subsystems/index.md
    # A Subsystem page documents a conceptual area rather than a single file, so
    # it needs no `resource`.
    resourceExemptTypes: [Subsystem]
  file-caps:
    # Ordered, first-match-wins (most-specific first). Line caps only, born-green
    # with no baseline — no tracked file is over cap. Markdown prose runs longer
    # than code; generated / vendored files are effectively uncapped.
    overrides:
      - glob: "**/pnpm-lock.yaml"
        lines: { error: 100000 }
      # Append-only metrics ledgers (one JSON line per CI run) grow without
      # bound by design — the whole point is to accumulate a distribution over
      # time (edit-fragility evaluation, #237). Effectively uncapped.
      - glob: "metrics/**"
        lines: { error: 100000 }
      - glob: "src/components/ui/**"
        lines: { error: 1000 }
      - glob: "**/*.md"
        lines: { error: 600 }
      - glob: "**/*"
        lines: { error: 500 }
