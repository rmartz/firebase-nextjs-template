name: Repo Hygiene

# @rmartz/repo-hygiene quality gates, run via its published reusable workflow.
# The `@<sha>` pin is kept current by Dependabot's github-actions ecosystem, so
# new checks and fixes propagate with no edit here. Per-check settings live in
# .repo-hygiene.yml (passed as `config`); the local `pnpm run hygiene:staged`
# pre-commit run is a fast-feedback companion to this CI gate.
#
# `checks` is explicit because the reusable workflow's default runs only the
# default-on set (conflict-markers, action-pins); the rest are opt-in.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    permissions:
      contents: read
      packages: read
    uses: rmartz/repo-hygiene/.github/workflows/hygiene.yml@9bea45565355ea99e4669ca2b8db8c8badf21a1b # v1.0.0
    with:
      checks: conflict-markers action-pins md-pairing okf okf-index file-caps
      config: .repo-hygiene.yml
