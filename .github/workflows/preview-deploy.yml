name: Preview Deploy

# Vercel preview deploy via the shared rmartz/vercel-preview-ci reusable
# workflow. A PR gets a preview when its title has a functional type (`feat`,
# `fix`, `perf`, `revert`) or it carries the `preview` label; `no preview`
# always skips. It is redeployed on each new push and the URL is posted as a
# sticky PR comment. Vercel's Git-integration previews are disabled in
# vercel.json (`git.deploymentEnabled`), so this is the only preview path. The
# gate, fork safety, and per-PR concurrency live in the shared workflow:
# https://github.com/rmartz/vercel-preview-ci/blob/main/docs/consuming.md
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Requires repo labels: `preview` and `no preview`.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  preview:
    # The template repo itself has no Vercel project, so it never deploys. A repo
    # created from the template deploys as soon as its secrets are set.
    if: github.repository != 'rmartz/firebase-nextjs-template'
    uses: rmartz/vercel-preview-ci/.github/workflows/vercel-preview.yml@42ebca3257dc76755982bcde196c0524bc4b9657 # v3.0.1
    with:
      node-version: 26.x
    secrets: inherit
