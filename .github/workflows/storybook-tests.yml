name: Storybook Tests

# Gating Storybook CI, delegated to the shared rmartz/storybook-ci reusable
# workflow (POC consumer — issue #253). It runs two jobs: the Vitest browser-mode
# story suite in real Chromium, and the production `build-storybook` compile check
# (a distinct render surface the story suite never exercises, since it renders
# through the addon-vitest transform and never invokes `storybook build`).
#
# Everything that used to be hand-rolled here — Chromium provisioning + caching
# with a retry, the docs-only change denylist, fail-vs-cancel budgeting — now lives
# in the shared workflow, so this caller is the inputs that genuinely differ.
#
# The `@<sha>` pin is kept current by Dependabot's github-actions ecosystem, so
# shared-logic fixes propagate with no edit here.
#
# Required-check note: the gating is a `detect-changes` job + per-job `if:` inside
# the reusable workflow, NOT an `on.paths` filter. A skipped required job counts as
# passing; a required check that never runs because its paths did not match hangs
# the PR forever. Do not add `paths` here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  storybook-tests:
    uses: rmartz/storybook-ci/.github/workflows/storybook-tests.yml@731dada2cdeb712b5443c4e2b29a3065f90ffd81 # v1.2.1
    with:
      # This repo runs its story suite through a dedicated Vitest config
      # (vitest.storybook.config.ts) rather than a `storybook` project inside
      # vitest.config.mts, so the shared default of `--project storybook` does not
      # resolve here. `build-command` and `run-build` keep their defaults
      # (`pnpm build-storybook`, enabled), which already match this repo.
      test-command: pnpm test:storybook
