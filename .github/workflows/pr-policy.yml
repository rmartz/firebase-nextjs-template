name: pr-policy

# Runs the @rmartz/pr-policy read-only PR content checks via
# rmartz/pr-policy-action, which posts a single `pr-policy` check-run and owns
# the `CI approval needed` label. Adopted here to validate the approach for
# retiring the per-repo pr-title-lint.yml (rmartz/ai-tools#312): today the CLI
# ships only the CI-change check, so pr-title-lint.yml stays until the title-type
# check lands and `pr-policy` is made a required status.
#
# pull_request_target is safe here only because nothing checks out or runs the
# PR's code — the CLI reads everything through the API. It is needed so fork and
# Dependabot PRs still get a write token for the check-run and label.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  checks: write # post the pr-policy check-run
  pull-requests: write # write the labels pr-policy owns (CI approval needed)
  contents: read # read changed files at the merge base and head
  packages: read # install the CLI from GitHub Packages

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Not named `pr-policy`: the CLI posts its own check-run under that exact name,
  # and a same-named job would add a second, always-green status.
  pr-policy:
    name: pr-policy (evaluate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rmartz/pr-policy-action@38f5acc49575fafddc3874acd91f8aea65f8ea7a # v1.0.0
        with:
          pr: ${{ github.event.pull_request.number }}
