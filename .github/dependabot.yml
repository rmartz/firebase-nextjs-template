version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # NOTE: no `cooldown` — do not re-add it (for either ecosystem). It adds
    # friction without meeting its goal: Dependabot keeps its PRs current, so a
    # bump to an aged release can still pull transitive deps published inside the
    # window, and pnpm hard-fails lockfile resolution when it cannot fall back to
    # a mature version, closing the update as `update_no_longer_possible`.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Version-locked families. Each is a set of packages that ship on a shared
      # version line (or whose majors are dictated by one member), so a bump to
      # one that is not matched by the rest breaks the build. Listed first to win
      # group-assignment precedence.
      #
      # Scope of update-types differs by whether the family crosses the dev/prod
      # boundary:
      #  - An all-dev or all-prod family only needs a group for MAJOR bumps. Its
      #    minor/patch bumps are already lockstep because every member falls into
      #    the same catch-all group (dev-dependencies or production-dependencies),
      #    so they batch into that one PR. MAJOR is the only bump type those
      #    catch-alls exclude (majors are ungrouped -> individual PRs), so it is
      #    the only case that would split a same-category family apart. Restricting
      #    these to `major` keeps their routine minor/patch bumps in the shared
      #    batch PR instead of spawning a dedicated family PR every release.
      #  - A family that spans prod AND dev (react) needs ALL update types: its
      #    minor/patch would otherwise scatter react/react-dom (prod) from their
      #    @types (dev) across the two catch-all PRs, breaking lockstep.
      react:
        # Spans prod (react, react-dom) and dev (@types) -> all update types, so
        # react/react-dom never drift from their @types across the prod/dev split.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        # vite + its react plugin + vitest + @vitest/* are one interlocked
        # toolchain: a vite major dictates the plugin and vitest majors (the
        # @vitejs/plugin-react 6 -> vite 8 coupling), so bump them together.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      # NOTE: storybook, eslint, and tailwind were previously grouped here as
      # major-only lockstep families, on the assumption a major must move every
      # member together. That assumption is UNTESTED for them: across the full
      # Dependabot history none of the three ever produced a single group PR — no
      # major bump of those families has occurred. They were removed (issue #222)
      # so that a future major surfaces as individual per-package PRs and
      # scripts/dependabot-audit.mjs can measure whether an ungrouped major
      # actually breaks the build. Re-add a family group only when that audit
      # shows an ungrouped major of it needed a companion fix PR to unblock.
      # react and vite are kept: both have merged real bumps cleanly, react must
      # span the prod/dev split, and vite's major (#207) landed green while
      # grouped — so their lockstep grouping is evidence-backed, not assumed.
      # TypeScript is the language/compiler itself, not a runtime library. A
      # major or minor bump can change type-checking behavior across the whole
      # codebase (new errors, changed inference) — a more significant, more
      # review-worthy change than a routine dependency bump — so split it into
      # its own PR for visibility rather than batching it with dev-dependencies.
      # Patch bumps are low-risk and ride the dev-dependencies group (omitting
      # "patch" here lets a TypeScript patch fall through to that batch, exactly
      # like the Prettier group below). The exact "typescript" pattern does not
      # match "typescript-eslint" (that stays in the eslint group).
      typescript:
        patterns:
          - "typescript"
        update-types:
          - "major"
          - "minor"
      # Prettier (and its plugins) drive formatting output, so a major or minor
      # bump can reformat the codebase and fail the Format check with no other
      # visible cause. Split those into their own PR — listed first to win
      # group-assignment precedence — for isolated review. Patch bumps are
      # trivial enough to ride along with the dev-dependencies group: omitting
      # "patch" here means a Prettier patch does not match this group and falls
      # through to dev-dependencies (minor/patch) below.
      prettier:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
        update-types:
          - "major"
          - "minor"
      # Group only minor and patch bumps into one PR per dependency type. Major
      # bumps match no group and so are raised as individual PRs, isolating the
      # updates most likely to require code changes for handling on their own.
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
