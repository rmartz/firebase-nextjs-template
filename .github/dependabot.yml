version: 2
# Every npm dependency here — including @rmartz/repo-hygiene — is public on npmjs,
# so Dependabot needs no registry block or DEPENDABOT_PACKAGES_TOKEN secret.
#
# The `.npmrc` at the repo root pins npmjs as the explicit base registry (and the
# @rmartz scope) — see that file and dependabot-core#15415 for why (pnpm 11.8+
# does not fall back across registries).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # NOTE: no explicit `cooldown` on npm — do not add one. It adds friction
    # without meeting its goal: Dependabot keeps its PRs current, so a bump to an
    # aged release can still pull transitive deps published inside the window, and
    # pnpm hard-fails lockfile resolution when it cannot fall back to a mature
    # version, closing the update as `update_no_longer_possible`. (Since
    # 2026-07-14 Dependabot applies a 3-day default cooldown even with no block
    # declared.) The github-actions entry below declares one only to exempt
    # first-party `rmartz/*` actions and reusable workflows — published from our
    # own repos with provenance — while third-party actions keep the default wait.
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # babel-plugin-react-compiler 1.0 silently skips any component with a
      # destructured prop default under Babel 8 (react/react#37406). This
      # @babel/core only drives the compiler in Vitest and Storybook (Next uses
      # its own bundled Babel 7), so a Babel 8 bump would still pass CI while
      # tests and stories quietly stop exercising compiled code. Remove this once a compiler release fixes
      # react/react#37406.
      - dependency-name: "@babel/core"
        versions: [">= 8.0.0"]
    groups:
      # Version-locked families. Each is a set of packages that ship on a shared
      # version line (or whose majors are dictated by one member), so a bump to
      # one that is not matched by the rest breaks the build. Listed first to win
      # group-assignment precedence.
      #
      # These families carry NO `update-types` filter, so each handles ALL of its
      # members' bump types (major/minor/patch) in one isolated PR. Dependabot
      # assigns a dependency to its most-specific matching group by pattern, then
      # applies that group's `update-types` — and an excluded type is DROPPED,
      # never released to a catch-all. (An earlier config restricted these to
      # major/minor "so patches fall through to dev-dependencies"; that
      # fall-through does not exist, so those patches were silently never proposed
      # and the deps drifted behind.) Unfiltered families keep every coupled bump
      # reviewable in one PR with nothing dropped. Majors are still isolated where
      # it matters: the catch-all groups below DO exclude majors, so an unfamilied
      # dep's major becomes its own individual PR.
      react:
        # Spans prod (react, react-dom) and dev (@types) -> all update types, so
        # react/react-dom never drift from their @types across the prod/dev split.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        # vite + its react plugin + vitest + @vitest/* are one interlocked
        # toolchain: a vite major dictates the plugin and vitest majors (the
        # @vitejs/plugin-react 6 -> vite 8 coupling), so bump them together. No
        # update-types filter: all bump types land in this one coupled PR.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # NOTE: storybook, eslint, and tailwind were previously grouped here as
      # major-only lockstep families, on the assumption a major must move every
      # member together. That assumption is UNTESTED for them: across the full
      # Dependabot history none of the three ever produced a single group PR — no
      # major bump of those families has occurred. They were removed (issue #222)
      # so that a future major surfaces as individual per-package PRs and
      # scripts/dependabot-audit.mjs can measure whether an ungrouped major
      # actually breaks the build. Re-add a family group only when that audit
      # shows an ungrouped major of it needed a companion fix PR to unblock.
      # react and vite are kept: both have merged real bumps cleanly, react must
      # span the prod/dev split, and vite's major (#207) landed green while
      # grouped — so their lockstep grouping is evidence-backed, not assumed.
      # (eslint is grouped again below, in the `ci` group — for pr-policy's title
      # rule, not as a lockstep family.)
      # TypeScript is the language/compiler itself, not a runtime library. A bump
      # can change type-checking behavior across the whole codebase (new errors,
      # changed inference) — a more review-worthy change than a routine dependency
      # bump — so isolate every TypeScript update in its own PR. No update-types
      # filter: patch bumps surface here too (a restriction would drop them, not
      # fall them through). The exact "typescript" pattern does not match
      # "typescript-eslint" (that rides the ci group below).
      typescript:
        patterns:
          - "typescript"
      # CI-sensitive tools in one group: pr-policy requires a `ci` title for any
      # eslint/prettier version change (the formatter/linter can fail files a PR
      # never touched), so they must not ride in a catch-all where they would
      # block every routine bump. Plugins and configs move in lockstep with their
      # tool. No update-types filter: a major brings its family with it, and a
      # restriction would silently drop the excluded bumps rather than fall them
      # through to dev-dependencies.
      ci:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
      # Group only minor and patch bumps into one PR per dependency type. Major
      # bumps match no group and so are raised as individual PRs, isolating the
      # updates most likely to require code changes for handling on their own.
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - "rmartz/*"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Minor and patch action bumps land in one PR; every major opens as its own
    # PR (matching the npm catch-alls above), so a pending major can never hold
    # routine bumps back from auto-merge.
    groups:
      # rmartz/storybook-ci ships its two reusable workflows on one version
      # line, so they always bump together. Dependabot names a reusable
      # workflow by its full path and opens one PR per file once a major
      # leaves the catch-all below; this group, listed first to win precedence
      # and with no update-types filter, keeps every bump (majors included) in
      # one PR titled by the group name.
      storybook-ci:
        patterns:
          - "rmartz/storybook-ci/*"
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
