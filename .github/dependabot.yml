version: 2
# @rmartz/repo-hygiene publishes to GitHub Packages, so Dependabot needs registry
# auth to see new versions. Set a Dependabot secret DEPENDABOT_PACKAGES_TOKEN (a
# token with `read:packages`) — ideally an organization-level Dependabot secret so
# every repo generated from this template inherits it. Without the secret,
# Dependabot cannot propose @rmartz/* updates; other npm updates are unaffected.
#
# The `.npmrc` at the repo root pins npmjs as the explicit base registry so that
# public deps resolve there and not against GitHub Packages — see that file and
# dependabot-core#15415 for why (pnpm 11.8+ does not fall back across registries).
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    # NOTE: no `cooldown` — do not re-add it (for either ecosystem). It adds
    # friction without meeting its goal: Dependabot keeps its PRs current, so a
    # bump to an aged release can still pull transitive deps published inside the
    # window, and pnpm hard-fails lockfile resolution when it cannot fall back to
    # a mature version, closing the update as `update_no_longer_possible`.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Version-locked families. Each is a set of packages that ship on a shared
      # version line (or whose majors are dictated by one member), so a bump to
      # one that is not matched by the rest breaks the build. Listed first to win
      # group-assignment precedence.
      #
      # These families carry NO `update-types` filter, so each handles ALL of its
      # members' bump types (major/minor/patch) in one isolated PR. Dependabot
      # assigns a dependency to its most-specific matching group by pattern, then
      # applies that group's `update-types` — and an excluded type is DROPPED,
      # never released to a catch-all. (An earlier config restricted these to
      # major/minor "so patches fall through to dev-dependencies"; that
      # fall-through does not exist, so those patches were silently never proposed
      # and the deps drifted behind.) Unfiltered families keep every coupled bump
      # reviewable in one PR with nothing dropped. Majors are still isolated where
      # it matters: the catch-all groups below DO exclude majors, so an unfamilied
      # dep's major becomes its own individual PR.
      react:
        # Spans prod (react, react-dom) and dev (@types) -> all update types, so
        # react/react-dom never drift from their @types across the prod/dev split.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        # vite + its react plugin + vitest + @vitest/* are one interlocked
        # toolchain: a vite major dictates the plugin and vitest majors (the
        # @vitejs/plugin-react 6 -> vite 8 coupling), so bump them together. No
        # update-types filter: all bump types land in this one coupled PR.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # NOTE: storybook, eslint, and tailwind were previously grouped here as
      # major-only lockstep families, on the assumption a major must move every
      # member together. That assumption is UNTESTED for them: across the full
      # Dependabot history none of the three ever produced a single group PR — no
      # major bump of those families has occurred. They were removed (issue #222)
      # so that a future major surfaces as individual per-package PRs and
      # scripts/dependabot-audit.mjs can measure whether an ungrouped major
      # actually breaks the build. Re-add a family group only when that audit
      # shows an ungrouped major of it needed a companion fix PR to unblock.
      # react and vite are kept: both have merged real bumps cleanly, react must
      # span the prod/dev split, and vite's major (#207) landed green while
      # grouped — so their lockstep grouping is evidence-backed, not assumed.
      # TypeScript is the language/compiler itself, not a runtime library. A bump
      # can change type-checking behavior across the whole codebase (new errors,
      # changed inference) — a more review-worthy change than a routine dependency
      # bump — so isolate every TypeScript update in its own PR. No update-types
      # filter: patch bumps surface here too (a restriction would drop them, not
      # fall them through). The exact "typescript" pattern does not match
      # "typescript-eslint" (that rides the dev-dependencies group).
      typescript:
        patterns:
          - "typescript"
      # Prettier (and its plugins) drive formatting output, so any bump can
      # reformat the codebase and fail the Format check with no other visible
      # cause. Isolate every Prettier update in its own PR for review. No
      # update-types filter: a restriction would silently drop Prettier patch
      # bumps (they do not fall through to dev-dependencies), leaving Prettier to
      # drift steadily behind.
      prettier:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
      # Group only minor and patch bumps into one PR per dependency type. Major
      # bumps match no group and so are raised as individual PRs, isolating the
      # updates most likely to require code changes for handling on their own.
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
